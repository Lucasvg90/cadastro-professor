<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Professor</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef3fb;
        color: #172d4c;
        margin: 0;
        padding: 0;
      }
      .page-wrapper {
        max-width: 640px;
        margin: 24px auto 80px;
        padding: 0 16px;
        position: relative;
      }
      .hero-block {
        position: relative;
        background: linear-gradient(135deg, #e8f5e9 0%, #f1f8f6 100%);
        border-radius: 28px;
        padding: 32px 28px;
        box-shadow: 0 18px 40px rgba(24, 71, 154, 0.12);
        overflow: hidden;
        margin-bottom: 120px;
      }
      .hero-block::before {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 32px;
        background: rgba(76, 175, 80, 0.14);
        right: -40px;
        top: -40px;
      }
      .hero-block h1 {
        margin-top: 0;
        margin-bottom: 0.75rem;
        color: #1b3b7b;
        font-size: 2.1rem;
        text-align:center;
      }
      .hero-block p {
        margin: 0.6rem 0;
        line-height: 1.7;
        color: #334665;
      }
      .form-card {
        position: relative;
        z-index: 1;
        background: #ffffff;
        border-radius: 24px;
        padding: 28px 24px;
        box-shadow: 0 22px 42px rgba(20, 50, 96, 0.12);
        margin-top: -90px;
      }
      .campo {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
      }
      input[type="text"],
      select {
        width: 100%;
        padding: 12px 14px;
        box-sizing: border-box;
        border: 1px solid #d4dae8;
        border-radius: 10px;
        background: #fff;
        color: #1f2f4b;
      }
      .checkbox-inline {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
      }
      .error-msg {
        color: red;
        font-size: 0.9rem;
        margin-top: 4px;
        min-height: 1em;
      }
      button {
        background-color: #1d5edd;
        color: #fff;
        border: none;
        padding: 12px 18px;
        cursor: pointer;
        border-radius: 10px;
        font-weight: 600;
      }
      button:hover {
        background-color: #0056b3;
      }
      .botoes-form {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        justify-content: center;
      }
      button.cancelar {
        background-color: #6c757d;
      }
      button.cancelar:hover {
        background-color: #5a6268;
      }
      .success-msg {
        color: #2e7d32;
        background: #e8f5e9;
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 20px;
        display: none;
      }
      .site-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #1e2d1e;
        color: #7a9a7a;
        font-size: 0.75rem;
        text-align: center;
        padding: 0.6rem 1rem;
        border-top: 1px solid #2e4a2e;
      }
      .site-footer a {
        color: #6db33f;
        text-decoration: none;
      }
      .site-footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="page-wrapper">
      <div class="hero-block">
        <h1 id="titulo">Cadastro de Professor</h1>
        <p>Use este formulário para cadastrar um novo professor ou atualizar os dados existentes.</p>
      </div>

      <div class="form-card">
        <form id="professorForm" novalidate>
          <input type="hidden" id="id" name="id" />
      <div class="campo">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required maxlength="100" />
        <p id="err-nome" class="error-msg"></p>
      </div>

      <div class="campo">
        <label for="matricula">Matrícula:</label>
        <input type="text" id="matricula" name="matricula" required maxlength="20" placeholder="SNC-12345"/>
        <p id="err-matricula" class="error-msg"></p>
      </div>

      <div class="campo">
        <label for="disciplina">Disciplina:</label>
        <input type="text" id="disciplina" name="disciplina" required maxlength="50" />
        <p id="err-disciplina" class="error-msg"></p>
      </div>

      <div class="campo checkbox-inline">
        <input type="checkbox" id="ativo" name="ativo" />
        <label for="ativo">Ativo</label>
      </div>

      <div class="botoes-form">
        <button type="submit" id="btnSubmit">Cadastrar Professor</button>
        <button type="button" class="cancelar" onclick="voltarParaLista()">Cancelar</button>
      </div>
    </form>
      </div>
    </div>

    <footer class="site-footer">
      Gerado pelo
      <a
        href="https://ftsuda-senac.github.io/tads-spring-initializr/"
        target="_blank"
        rel="noopener noreferrer"
        >TADS Spring Initializr</a
      >
      — v1.1.6 <br />Lucas de Sousa Moura / Paulo Henrique Candido da Silva -
      3TADSNA - 2026<br />
      Criado a partir do Claude Code e Github Copilot
    </footer>

    <script>
      let modoEdicao = false;

      // Carregar dados do professor se em modo edição
      async function carregarDadosProfessor(id) {
        try {
          const response = await fetch(`/api/professores/${id}`);
          if (!response.ok) {
            throw new Error("Professor não encontrado");
          }
          const professor = await response.json();
          
          document.getElementById('id').value = professor.id;
          document.getElementById('nome').value = professor.nome;
          document.getElementById('matricula').value = professor.matricula;
          document.getElementById('disciplina').value = professor.disciplina;
          document.getElementById('ativo').checked = professor.ativo;
          
          document.getElementById('titulo').textContent = 'Editar Professor';
          document.getElementById('btnSubmit').textContent = 'Atualizar Professor';
          modoEdicao = true;
        } catch (error) {
          alert('Erro ao carregar dados do professor: ' + error.message);
          window.location.href = 'index.html';
        }
      }

      // Verificar se há ID na URL
      window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (id) {
          carregarDadosProfessor(parseInt(id));
        }
      });

      function voltarParaLista() {
        window.location.href = 'index.html';
      }

      document.getElementById('professorForm').addEventListener('submit', async (evt) => {
        evt.preventDefault();
        limparErros();

        const formEl = evt.target;
        const id = document.getElementById('id').value;
        
        const dados = {
          nome: formEl.nome.value.trim(),
          matricula: formEl.matricula.value.trim(),
          disciplina: formEl.disciplina.value.trim(),
          ativo: formEl.ativo.checked
        };

        try {
          let response;
          let mensagemOperacao = 'cadastrado';
          
          if (modoEdicao && id) {
            // Edição (PUT)
            response = await fetch(`/api/professores/${id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(dados)
            });
            mensagemOperacao = 'atualizado';
          } else {
            // Cadastro (POST)
            response = await fetch('/api/professores', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(dados)
            });
          }

          if (!response.ok) {
            let mensagemErro = '';
            try {
              const payload = await response.json();
              if (payload && payload.errors) {
                exibirErros(payload.errors);
                mensagemErro = `Erro ${response.status} - Há campos vazios e/ou preenchidos incorretamente`;
              } else if (payload && payload.message) {
                mensagemErro = `Erro ${response.status} - ${payload.message}`;
              } else if (payload && payload.error) {
                mensagemErro = `Erro ${response.status} - ${payload.error}`;
              } else {
                mensagemErro = `Erro ${response.status} - ${response.statusText || 'Ocorreu um erro'}`;
              }
            } catch {
              mensagemErro = `Erro ${response.status} - ${response.statusText || 'Ocorreu um erro'}`;
            }

            alert(mensagemErro);
            return;
          }

          // Redirecionar com mensagem de sucesso
          window.location.href = `index.html?sucesso=true&operacao=${mensagemOperacao}`;
        } catch (error) {
          console.error('Erro na conexão:', error);
          alert('Erro na conexão com o servidor: ' + error.message);
        }
      });

      function limparErros() {
        document.querySelectorAll('.error-msg').forEach((el) => {
          el.textContent = '';
        });
      }

      function exibirErros(erros) {
        if (!Array.isArray(erros)) return;
        for (const erro of erros) {
          const elementoErro = document.getElementById(`err-${erro.field}`);
          if (elementoErro) {
            elementoErro.textContent = erro.defaultMessage;
          }
        }
      }
    </script>
  </body>
</html>
